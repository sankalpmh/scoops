name: Build and deploy Scoops to Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "manifests/**"
      - ".github/**"
      - ".gitignore"
  workflow_dispatch:

env:
  PROJECT_ID: project-1d7cad77-567e-48ed-b75
  REGION: asia-south1
  GAR_REPOSITORY: scoops-repo
  IMAGE_NAME: scoops
  SERVICE_NAME: scoops
  RUNTIME_SA: scoops-cloudrun-runtime@project-1d7cad77-567e-48ed-b75.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          docker build --pull -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_URI}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${RUNTIME_SA}" \
            --port 80 \
            --cpu 1 \
            --memory 256Mi \
            --min 0 \
            --max 1 \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format="value(status.url)"
